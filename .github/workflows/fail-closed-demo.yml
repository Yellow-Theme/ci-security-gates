name: fail-closed-demo

# Synthetic reference. Not a client workflow and not an audit conclusion.
#
# Assessor: this workflow deliberately scans fixtures/ so the run is red.
# It is not a required check on main. Required gates stay on security-gates.yml
# (app/ only). Do not set continue-on-error — a green demo would be fake.
#
# Why a separate workflow: fixtures prove the fail path without making main's
# required jobs permanently red. Trigger via workflow_dispatch, or a PR that
# touches fixtures/ / this file.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fixtures/**"
      - ".github/workflows/fail-closed-demo.yml"
      - "scripts/expect-fixture-fail.sh"

concurrency:
  group: fail-closed-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  fixtures-semgrep:
    name: fixtures-semgrep
    # Deliberate fail path. Fixture: fixtures/eval.js (local rule).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7 (pinned 2026-09-13)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7 (pinned 2026-09-13)
        with:
          python-version: "3.12"

      - name: Semgrep on fixtures/eval.js (expected fail)
        run: |
          set -euo pipefail
          pip install "semgrep==1.177.0"
          # Point at the file. .semgrepignore lists fixtures/ so a directory
          # target scans 0 files; the required sast job still scopes to app/.
          semgrep scan --config fixtures/rules --error fixtures/eval.js --metrics=off --sarif --output semgrep-fixtures.sarif

      - name: Assessor note
        if: always()
        run: |
          {
            echo "## Fail-closed demo — Semgrep on fixtures/"
            echo "This job is supposed to fail. Fixture: \`fixtures/eval.js\` via \`fixtures/rules\` (file target; \`.semgrepignore\` lists \`fixtures/\`)."
            echo "Not a required check on \`main\`. Evidence is this run URL plus \`semgrep-fixtures-sarif\`, not a screenshot."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7 (pinned 2026-09-13)
        with:
          name: semgrep-fixtures-sarif
          path: semgrep-fixtures.sarif
          if-no-files-found: warn
          retention-days: 14

  fixtures-gitleaks:
    name: fixtures-gitleaks
    # Deliberate fail path. Fixture: AWS docs example key in fixtures/config.env.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7 (pinned 2026-09-13)

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          file="gitleaks_${version}_linux_x64.tar.gz"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL -o "/tmp/${file}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${file}"
          echo "${expected}  /tmp/${file}" | sha256sum -c -
          tar -xzf "/tmp/${file}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks on fixtures/ (expected fail)
        run: |
          set -euo pipefail
          gitleaks detect --no-git --source fixtures --config fixtures/gitleaks-fail.toml --redact --report-format sarif --report-path gitleaks-fixtures.sarif --verbose

      - name: Assessor note
        if: always()
        run: |
          {
            echo "## Fail-closed demo — gitleaks on fixtures/"
            echo "This job is supposed to fail. Fixture: documented example \`AKIAIOSFODNN7EXAMPLE\` in \`fixtures/config.env\` (not a credential)."
            echo "Not a required check on \`main\`. Evidence is this run URL plus \`gitleaks-fixtures-sarif\`, not a screenshot."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gitleaks fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7 (pinned 2026-09-13)
        with:
          name: gitleaks-fixtures-sarif
          path: gitleaks-fixtures.sarif
          if-no-files-found: warn
          retention-days: 14
